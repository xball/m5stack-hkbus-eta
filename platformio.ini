; M5Stack Basic Core (ESP32) — HK Bus ETA
; This unit reports 4MB flash; huge_app gives ~3MB for the app (fits CJK fonts).
[env:m5stack-basic]
platform = espressif32
board = m5stack-core-esp32
framework = arduino
monitor_speed = 115200
; upload_port = COM7
board_build.flash_mode = qio
board_build.f_flash = 80000000L
board_upload.flash_size = 4MB
board_build.partitions = huge_app.csv
board_build.arduino.loop_task_stack_size = 16384
lib_deps =
  m5stack/M5Unified @ ^0.2.2
  bblanchon/ArduinoJson @ ^7.2.0
build_flags =
  -DCORE_DEBUG_LEVEL=1
  -DBOARD_HAS_PSRAM=0
